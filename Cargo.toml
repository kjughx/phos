[package]
name = "ruix"
version = "0.1.0"
edition = "2021"

[dependencies]
packed_macro = {path = "packed_macro"}

[build-dependencies]
cc = "1.0"

# the profile used for `cargo build`
[profile.dev]
panic = "abort" # disable stack unwinding on panic
opt-level = "s"

# the profile used for `cargo build --release`
[profile.release]
panic = "abort" # disable stack unwinding on panic
opt-level = "s"
